name: Build NetControl Windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore NetControl.Windows/NetControl.Windows.csproj
      - name: Build
        run: dotnet build NetControl.Windows/NetControl.Windows.csproj -c Release --no-restore
      - name: Publish win-x64
        run: dotnet publish NetControl.Windows/NetControl.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: NetControl-Windows-win-x64
          path: publish/
